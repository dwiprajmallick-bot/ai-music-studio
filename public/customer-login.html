<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - MelodyAI Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500">
    <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl max-w-md w-full shadow-2xl relative">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-2">
                <i data-lucide="user-check" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold text-white">কাস্টমার পোর্টাল</h2>
            <p class="text-xs text-slate-400 mt-1">আপনার স্টুডিও প্রজেক্ট ও ক্রেডিট অ্যাক্সেস করতে লগইন করুন</p>
        </div>

        <!-- মেথড টগল ট্যাব -->
        <div class="flex rounded-xl bg-slate-950 p-1 mb-6 border border-slate-800">
            <button id="tabEmail" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition flex items-center justify-center gap-1.5">
                <i data-lucide="mail" class="w-3.5 h-3.5"></i> ইমেইল ও পাসওয়ার্ড
            </button>
            <button id="tabPhone" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
                <i data-lucide="smartphone" class="w-3.5 h-3.5"></i> মোবাইল ও ওটিপি
            </button>
        </div>

        <!-- মেথড ১: ইমেইল ও পাসওয়ার্ড লগইন / সাইন-আপ -->
        <div id="sectionEmail" class="space-y-4">
            <form id="emailLoginForm" class="space-y-3">
                <div id="divName" class="hidden">
                    <label class="block text-xs font-medium text-slate-300 mb-1">আপনার নাম</label>
                    <input type="text" id="custName" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="Dwipraj Mallick">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ইমেইল এড্রেস</label>
                    <input type="email" id="custEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="user@gmail.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="custPassword" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" id="btnEmailSubmit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition">
                    লগইন করুন
                </button>
            </form>

            <div class="text-center text-xs text-slate-400 pt-2">
                <span id="txtTogglePrompt">অ্যাকাউন্ট নেই?</span> 
                <button id="btnToggleMode" class="text-indigo-400 font-semibold hover:underline">নতুন অ্যাকাউন্ট তৈরি করুন</button>
            </div>
        </div>

        <!-- মেথড ২: যেকোনো দেশের মোবাইল নম্বর ও ওটিপি -->
        <div id="sectionPhone" class="space-y-4 hidden">
            <!-- ধাপ ক: মোবাইল নম্বর ইনপুট ও দেশ নির্বাচন -->
            <form id="phoneSendOtpForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">দেশ ও মোবাইল নম্বর</label>
                    <div class="flex gap-1.5">
                        <select id="countryDialCode" class="w-36 bg-slate-950 border border-slate-800 rounded-xl px-2 py-3 text-xs text-white outline-none focus:border-indigo-500 font-mono">
                            <option value="+91">🇮🇳 India (+91)</option>
                            <option value="+880">🇧🇩 Bangladesh (+880)</option>
                            <option value="+1">🇺🇸 USA / 🇨🇦 CA (+1)</option>
                            <option value="+44">🇬🇧 UK (+44)</option>
                            <option value="+971">🇦🇪 UAE (+971)</option>
                            <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
                            <option value="+965">🇰🇼 Kuwait (+965)</option>
                            <option value="+974">🇶🇦 Qatar (+974)</option>
                            <option value="+968">🇴🇲 Oman (+968)</option>
                            <option value="+977">🇳🇵 Nepal (+977)</option>
                            <option value="+94">🇱🇰 Sri Lanka (+94)</option>
                            <option value="+92">🇵🇰 Pakistan (+92)</option>
                            <option value="+60">🇲🇾 Malaysia (+60)</option>
                            <option value="+65">🇸🇬 Singapore (+65)</option>
                            <option value="+61">🇦🇺 Australia (+61)</option>
                            <option value="+49">🇩🇪 Germany (+49)</option>
                            <option value="+33">🇫🇷 France (+33)</option>
                            <option value="+81">🇯🇵 Japan (+81)</option>
                            <option value="+82">🇰🇷 South Korea (+82)</option>
                            <option value="+86">🇨🇳 China (+86)</option>
                            <option value="+55">🇧🇷 Brazil (+55)</option>
                        </select>
                        <input type="tel" id="custPhone" required class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500 font-mono tracking-wider" placeholder="মোবাইল নম্বর লিখুন">
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1">যে দেশের নম্বর, সেই দেশের কোড নির্বাচন করুন</p>
                </div>
                <button type="submit" id="btnSendOtp" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                    <i data-lucide="key" class="w-3.5 h-3.5"></i> ওটিপি (OTP) পাঠান
                </button>
            </form>

            <!-- ধাপ খ: ওটিপি ভেরিফিকেশন -->
            <form id="phoneVerifyOtpForm" class="space-y-3 hidden">
                <div class="p-2.5 bg-indigo-950/40 border border-indigo-800/60 rounded-xl text-center">
                    <p class="text-[11px] text-indigo-300"><span id="displaySentPhone" class="font-mono font-bold"></span> নম্বরে ৬ সংখ্যার ওটিপি পাঠানো হয়েছে।</p>
                    <p id="demoOtpBadge" class="text-[11px] text-amber-400 font-mono mt-1 font-bold"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">৬ সংখ্যার ওটিপি কোড</label>
                    <input type="text" id="custOtp" required maxlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500 font-mono text-center tracking-widest text-base" placeholder="••••••">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                    <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> যাচাই ও প্রবেশ করুন
                </button>
                <button type="button" id="btnBackToPhone" class="w-full text-center text-xs text-slate-500 hover:text-slate-300 pt-1">
                    ভুল নম্বর? আবার নম্বর পরিবর্তন করুন
                </button>
            </form>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300 inline-flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> হোমপেজে ফিরে যান
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const tabEmail = document.getElementById("tabEmail");
        const tabPhone = document.getElementById("tabPhone");
        const sectionEmail = document.getElementById("sectionEmail");
        const sectionPhone = document.getElementById("sectionPhone");

        tabEmail.addEventListener("click", () => {
            tabEmail.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition flex items-center justify-center gap-1.5";
            tabPhone.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5";
            sectionEmail.classList.remove("hidden");
            sectionPhone.classList.add("hidden");
        });

        tabPhone.addEventListener("click", () => {
            tabPhone.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition flex items-center justify-center gap-1.5";
            tabEmail.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5";
            sectionPhone.classList.remove("hidden");
            sectionEmail.classList.add("hidden");
        });

        let isRegisterMode = false;
        const divName = document.getElementById("divName");
        const btnEmailSubmit = document.getElementById("btnEmailSubmit");
        const txtTogglePrompt = document.getElementById("txtTogglePrompt");
        const btnToggleMode = document.getElementById("btnToggleMode");

        btnToggleMode.addEventListener("click", () => {
            isRegisterMode = !isRegisterMode;
            if (isRegisterMode) {
                divName.classList.remove("hidden");
                btnEmailSubmit.innerText = "নতুন অ্যাকাউন্ট তৈরি করুন";
                txtTogglePrompt.innerText = "ইতিমধ্যে অ্যাকাউন্ট আছে?";
                btnToggleMode.innerText = "লগইন করুন";
            } else {
                divName.classList.add("hidden");
                btnEmailSubmit.innerText = "লগইন করুন";
                txtTogglePrompt.innerText = "অ্যাকাউন্ট নেই?";
                btnToggleMode.innerText = "নতুন অ্যাকাউন্ট তৈরি করুন";
            }
        });

        document.getElementById("emailLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("custEmail").value.trim();
            const password = document.getElementById("custPassword").value.trim();
            const name = document.getElementById("custName").value.trim();

            const endpoint = isRegisterMode ? "/api/auth/customer/register" : "/api/auth/customer/login";
            const payload = isRegisterMode ? { email, password, name } : { email, password };

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    if (isRegisterMode) {
                        alert(data.message);
                        btnToggleMode.click();
                    } else {
                        localStorage.setItem("melody_user", JSON.stringify(data.user));
                        localStorage.setItem("melody_credits", data.user.credits);
                        alert("স্বাগতম! লগইন সফল হয়েছে।");
                        window.location.href = "/";
                    }
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("সার্ভার ত্রুটি। আবার চেষ্টা করুন।");
            }
        });

        const phoneSendOtpForm = document.getElementById("phoneSendOtpForm");
        const phoneVerifyOtpForm = document.getElementById("phoneVerifyOtpForm");
        let activeFullPhone = "";

        phoneSendOtpForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const countryCode = document.getElementById("countryDialCode").value;
            const phoneNumber = document.getElementById("custPhone").value.trim().replace(/^0+/, ""); // লিডিং জিরো বাদ দেওয়া

            if (phoneNumber.length < 6) return alert("সঠিক মোবাইল নম্বর দিন।");

            try {
                const res = await fetch("/api/auth/customer/phone/send-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ countryCode, phoneNumber })
                });
                const data = await res.json();
                if (data.success) {
                    activeFullPhone = data.fullPhone;
                    phoneSendOtpForm.classList.add("hidden");
                    phoneVerifyOtpForm.classList.remove("hidden");
                    document.getElementById("displaySentPhone").innerText = data.fullPhone;
                    if (data.demoOtp) {
                        document.getElementById("demoOtpBadge").innerText = "টেস্ট ওটিপি কোড: " + data.demoOtp;
                    }
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("ওটিপি পাঠাতে সমস্যা হয়েছে।");
            }
        });

        phoneVerifyOtpForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const otp = document.getElementById("custOtp").value.trim();

            try {
                const res = await fetch("/api/auth/customer/phone/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ fullPhone: activeFullPhone, otp })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem("melody_user", JSON.stringify(data.user));
                    localStorage.setItem("melody_credits", data.user.credits);
                    alert("মোবাইল ওটিপি যাচাই সফল! প্ল্যাটফর্মে প্রবেশ করা হচ্ছে...");
                    window.location.href = "/";
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("যাচাই করতে সমস্যা হয়েছে।");
            }
        });

        document.getElementById("btnBackToPhone").addEventListener("click", () => {
            phoneVerifyOtpForm.classList.add("hidden");
            phoneSendOtpForm.classList.remove("hidden");
        });
    </script>
</body>
</html>
