<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Secure Login - MelodyAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl relative">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-2">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold text-white">কাস্টমার পোর্টাল</h2>
            <p class="text-xs text-slate-400 mt-1">আপনার স্টুডিও প্রজেক্ট ও ক্রেডিট অ্যাক্সেস করতে লগইন করুন</p>
        </div>

        <form id="custLoginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">ইমেইল এড্রেস</label>
                <input type="email" id="cEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="user@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="cPassword" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition">
                নিরাপদ লগইন
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            নতুন ইউজার? <a href="#" id="btnToggleRegister" class="text-indigo-400 font-semibold hover:underline">অ্যাকাউন্ট তৈরি করুন</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById("custLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const res = await fetch("/api/auth/customer/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: document.getElementById("cEmail").value, password: document.getElementById("cPassword").value })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem("melody_user", JSON.stringify(data.user));
                localStorage.setItem("melody_token", data.token);
                alert("লগইন সফল!");
                window.location.href = "/";
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
