<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MelodyAI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="border-b border-slate-800 p-4 bg-slate-900/80">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white"><i data-lucide="music-4" class="w-5 h-5"></i></div>
                <span class="font-bold text-lg text-white">MelodyAI Global Pro</span>
            </a>
            <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg">হোমপেজে ফিরুন</a>
        </div>
    </header>

    <main class="flex-1 max-w-3xl mx-auto p-6 md:p-12 w-full space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-white">যোগাযোগ করুন (Contact Us)</h1>
            <p class="text-slate-400 text-xs">আপনার কোনো প্রশ্ন, অভিযোগ বা ফিডব্যাক থাকলে আমাদের বার্তা পাঠান।</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 space-y-6 shadow-xl">
            <form id="contactForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">আপনার নাম</label>
                    <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="Dwipraj Mallick">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">ইমেইল এড্রেস</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500" placeholder="user@gmail.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">বার্তা বা সমস্যা</label>
                    <textarea rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500 resize-none" placeholder="আপনার সমস্যা বা বার্তাটি লিখুন..."></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> বার্তা পাঠান
                </button>
            </form>

            <div class="pt-6 border-t border-slate-800/80 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-3">
                <div class="flex items-center gap-2"><i data-lucide="mail" class="w-4 h-4 text-indigo-400"></i> support@melodyai.pro</div>
                <div class="flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-emerald-400"></i> ২৪/৭ গ্রাহক সহায়তা</div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        © 2026 MelodyAI Pro. All rights reserved.
    </footer>
    <script>
        lucide.createIcons();
        document.getElementById("contactForm").addEventListener("submit", (e) => {
            e.preventDefault();
            alert("ধন্যবাদ! আপনার বার্তাটি আমাদের সাপোর্টে জমা হয়েছে। খুব শীঘ্রই আপনার ইমেইলে উত্তর দেওয়া হবে।");
            e.target.reset();
        });
    </script>
</body>
</html>
